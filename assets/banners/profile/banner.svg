<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Masud Ibn Musa</title>
  <desc id="desc">Animated banner: a signal travels along a pipeline from workflow to prototype to agents and RAG to production.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#0ea5a4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0ea5a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="1" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="0.55" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <path id="pipe" d="M720 196 C 780 196, 780 112, 840 112 S 910 196, 970 196 S 1040 112, 1100 112"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .flow { stroke-dasharray: 6 10; animation: flow 1.4s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ping 2.8s ease-out infinite; }
    .r2 { animation-delay: .7s; } .r3 { animation-delay: 1.4s; } .r4 { animation-delay: 2.1s; }
    .drift { animation: drift 9s ease-in-out infinite alternate; }
    .d2 { animation-duration: 12s; } .d3 { animation-duration: 7s; }
    .rise { opacity: 0; animation: rise .8s ease-out forwards; }
    .t2 { animation-delay: .25s; } .t3 { animation-delay: .5s; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
    @keyframes drift { to { transform: translate(14px, -10px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .cursor, .ring, .drift { animation: none; }
      .rise { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1200" height="300" fill="#0a0f1c"/>
    <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>

    <!-- drifting particles -->
    <g fill="#7dd3fc">
      <circle class="drift" cx="610" cy="60" r="1.6" opacity=".5"/>
      <circle class="drift d2" cx="1150" cy="250" r="2" opacity=".4"/>
      <circle class="drift d3" cx="660" cy="250" r="1.4" opacity=".45"/>
      <circle class="drift d2" cx="1010" cy="48" r="1.5" opacity=".5"/>
      <circle class="drift" cx="540" cy="200" r="1.2" opacity=".35"/>
    </g>

    <!-- left: copy -->
    <g class="mono rise" font-size="16" fill="#8b98a9">
      <text x="64" y="86"><tspan fill="#5eead4">~/masud</tspan> <tspan fill="#64748b">$</tspan> deploy --from <tspan fill="#7dd3fc">prototype</tspan> --to <tspan fill="#4ade80">production</tspan><tspan class="cursor" fill="#e6edf3"> ▌</tspan></text>
    </g>
    <text class="sans rise t2" x="62" y="160" font-size="62" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Masud Ibn Musa</text>
    <g class="rise t3">
      <text class="sans" x="64" y="208" font-size="17" fill="#94a3b8">Taking AI from prototype to production, inside real business workflows.</text>
    </g>

    <!-- right: pipeline -->
    <use href="#pipe" fill="none" stroke="url(#wire)" stroke-width="2" stroke-opacity=".25"/>
    <use href="#pipe" class="flow" fill="none" stroke="url(#wire)" stroke-width="2"/>

    <!-- travelling signal -->
    <g>
      <circle r="9" fill="#5eead4" filter="url(#blur)" opacity=".9"/>
      <circle r="4" fill="#ecfeff"/>
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear">
        <mpath href="#pipe"/>
      </animateMotion>
    </g>

    <!-- nodes -->
    <g>
      <circle class="ring" cx="720" cy="196" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="720" cy="196" r="7" fill="#0a0f1c" stroke="#38bdf8" stroke-width="2.5"/>
      <circle class="ring r2" cx="840" cy="112" r="10" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
      <circle cx="840" cy="112" r="7" fill="#0a0f1c" stroke="#2dd4bf" stroke-width="2.5"/>
      <circle class="ring r3" cx="970" cy="196" r="10" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="970" cy="196" r="7" fill="#0a0f1c" stroke="#34d399" stroke-width="2.5"/>
      <circle class="ring r4" cx="1100" cy="112" r="12" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="1100" cy="112" r="11" fill="#4ade80"/>
      <path d="M1095 112.5 l3.5 3.5 l6.5 -7" fill="none" stroke="#052e16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g class="mono" font-size="13" text-anchor="middle" fill="#94a3b8">
      <text x="720" y="230">workflow</text>
      <text x="840" y="84">prototype</text>
      <text x="970" y="230">agents · RAG</text>
      <text x="1100" y="80" fill="#4ade80">production</text>
    </g>

    <!-- footer ticker -->
    <text class="mono" x="1136" y="274" font-size="12" text-anchor="end" fill="#475569">status: <tspan fill="#4ade80">● shipping</tspan></text>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#1e293b"/>
</svg>
